<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dot Muncher">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#bfe9ff">
<meta name="description" content="A gentle cartoon 3D snake game for little ones — cel-shaded style, hats, levels and skins. Plays fully offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Dot Muncher 🐍</title>
</head>
<body>
<style>
  :root{ --card:#ffffffee; --pill-ink:#1f6b3f; --ink:#204a30; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"ui-rounded","SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink); background:#bfe9ff; overflow:hidden;
    user-select:none;-webkit-user-select:none; touch-action:none;
  }
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none;}
  #app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
       align-items:center;justify-content:space-between;pointer-events:none;
       padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 18px);}
  #top{width:100%;max-width:600px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  #topbar{width:100%;display:flex;align-items:center;justify-content:center;gap:14px;position:relative;}
  #score{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:100px;
    padding:9px 20px 9px 13px;box-shadow:0 8px 24px #1c4a3033, inset 0 0 0 3px #ffffff;}
  #score .berry{width:32px;height:32px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%,#ffd0d8,#ff5d73 55%,#e23a55);
    box-shadow:inset 0 -4px 8px #b81f3a66, 0 4px 8px #ff5d7355;}
  #score .num{font-size:34px;font-weight:800;line-height:1;color:var(--pill-ink);
    font-variant-numeric:tabular-nums;min-width:1.2ch;text-align:center;}
  #score .num.pop{animation:pop .35s ease;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
  #score .cap{font-size:13px;font-weight:700;color:#5a8a6c;letter-spacing:.06em;text-transform:uppercase;}
  .rbtn{pointer-events:auto;width:50px;height:50px;border:none;border-radius:50%;background:var(--card);
    box-shadow:0 6px 18px #1c4a3033, inset 0 0 0 3px #ffffff; font-size:24px;cursor:pointer;display:grid;place-items:center;position:absolute;top:50%;transform:translateY(-50%);}
  .rbtn:active{transform:translateY(-50%) scale(.92);}
  #homeBtn{left:0;} #sound{right:0;}
  #xpwrap{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:100px;
    padding:6px 14px 6px 8px;box-shadow:0 6px 16px #1c4a3022, inset 0 0 0 3px #ffffff;width:100%;max-width:360px;}
  #lv{display:flex;align-items:center;justify-content:center;min-width:46px;height:30px;padding:0 10px;border-radius:100px;
    background:linear-gradient(180deg,#ffd54a,#ffb020);color:#7a4a00;font-weight:800;font-size:15px;
    box-shadow:inset 0 0 0 2px #fff6, 0 3px 6px #d9860033;white-space:nowrap;}
  #xpbar{flex:1;height:20px;background:#e7eee9;border-radius:100px;overflow:hidden;box-shadow:inset 0 1px 3px #0002;position:relative;}
  #xpfill{height:100%;width:0%;border-radius:100px;background:linear-gradient(90deg,#7ad0ff,#4f9bff);transition:width .3s ease;}
  #xptext{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;color:#2b4a6a;
    text-shadow:0 1px 2px #fff;font-variant-numeric:tabular-nums;}
  #hint{font-size:16px;font-weight:700;color:#2c6a49;background:var(--card);
    padding:9px 20px;border-radius:100px;box-shadow:0 6px 16px #1c4a3022, inset 0 0 0 3px #ffffff; transition:opacity .6s;}
  #toast{position:fixed;left:50%;top:30%;transform:translate(-50%,-10px);z-index:5;pointer-events:none;
    background:linear-gradient(180deg,#fff,#eef7ff);color:#1f5fae;font-weight:800;font-size:20px;
    padding:12px 24px;border-radius:18px;box-shadow:0 12px 30px #1c4a3033, inset 0 0 0 3px #fff;
    opacity:0;transition:opacity .3s, transform .3s;text-align:center;line-height:1.25;}
  #toast.show{opacity:1;transform:translate(-50%,0);}
  .overlay{position:fixed;inset:0;z-index:6;display:none;place-items:center;pointer-events:auto;
    background:#0b2a1ac0;backdrop-filter:blur(5px);padding:20px;}
  .overlay.show{display:grid;}
  .card{background:linear-gradient(180deg,#ffffff,#f2faff);border-radius:30px;box-shadow:0 24px 70px #0007;
    max-width:460px;width:100%;max-height:90vh;overflow:auto;padding:24px 20px;text-align:center;}
  .pcard{animation:rise .35s cubic-bezier(.2,1.3,.5,1);}
  @keyframes rise{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
  .bigTitle{font-size:40px;font-weight:900;letter-spacing:-.5px;margin:2px 0 2px;
    background:linear-gradient(180deg,#3f8bff,#2f6bd8);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .tag{color:#6b8a78;font-weight:700;font-size:15px;margin:0 0 16px;}
  .chips{display:flex;gap:10px;justify-content:center;margin:0 0 20px;flex-wrap:wrap;}
  .chip{display:flex;align-items:center;gap:6px;background:#eef6f0;border-radius:100px;padding:8px 16px;
    font-weight:800;color:#2b4a39;font-size:16px;box-shadow:inset 0 0 0 2px #0000000a;}
  .chip.gold{background:linear-gradient(180deg,#fff2c9,#ffe08a);color:#8a5a00;}
  .bigBtn{border:none;border-radius:100px;padding:16px 20px;font-weight:900;font-size:22px;cursor:pointer;width:100%;
    color:#fff;background:linear-gradient(180deg,#57d07f,#2fa85f);box-shadow:0 10px 22px #2a8a5544, inset 0 0 0 3px #ffffff55;margin-top:6px;}
  .bigBtn:active{transform:scale(.97);}
  .lnkBtn{border:none;background:#eef6f0;border-radius:100px;padding:12px 18px;font-weight:800;font-size:17px;color:#2b4a39;cursor:pointer;width:100%;margin-top:10px;box-shadow:inset 0 0 0 2px #0000000d;}
  .lnkBtn:active{transform:scale(.97);}
  #rwTitle{font-size:34px;font-weight:900;color:#2f6bd8;margin:2px 0 4px;}
  #rwBody{margin:8px 0 20px;}
  .rwSwatch{width:120px;height:120px;border-radius:26px;margin:6px auto 12px;box-shadow:inset 0 -8px 16px #0003, inset 0 0 0 3px #fff8, 0 10px 24px #0003;}
  .rwStar{font-size:96px;line-height:1;margin:6px 0 8px;filter:drop-shadow(0 8px 12px #e0a83055);}
  .rwName{font-size:24px;font-weight:900;color:#2b4a39;}
  .rwSub{font-size:15px;font-weight:700;color:#6b8a78;margin-top:4px;}
  .secLabel{text-align:left;font-weight:900;color:#2b4a39;font-size:15px;margin:6px 2px 8px;letter-spacing:.04em;text-transform:uppercase;}
  .cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px;}
  .tile{border:none;border-radius:16px;padding:10px 8px;cursor:pointer;text-align:center;position:relative;
    background:#f3f7f4;box-shadow:inset 0 0 0 2px #0000000d;transition:transform .08s;}
  .tile:active{transform:scale(.96);}
  .tile .swatch{width:100%;height:46px;border-radius:11px;margin-bottom:6px;box-shadow:inset 0 -6px 12px #0003, inset 0 0 0 2px #fff8;}
  .tile .swatch.emoji{display:grid;place-items:center;font-size:30px;background:#eaf3ee;box-shadow:inset 0 0 0 2px #0000000d;}
  .tile .nm{font-weight:800;color:#2b4a39;font-size:13px;}
  .tile .req{font-size:11px;font-weight:700;color:#c06a2a;margin-top:2px;min-height:14px;line-height:1.15;}
  .tile.locked{filter:grayscale(.7);opacity:.85;}
  .tile.locked .swatch::after{content:"🔒";position:absolute;left:0;right:0;top:12px;font-size:22px;}
  .tile.sel{box-shadow:inset 0 0 0 4px #4f9bff, 0 6px 16px #4f9bff55;}
  .tile.sel .req{color:#2f7d4f;}
</style>

<canvas id="gl"></canvas>
<div id="app">
  <div id="top">
    <div id="topbar">
      <button id="homeBtn" class="rbtn" aria-label="Home">🏠</button>
      <div id="score"><div class="berry"></div><div class="num" id="num">0</div><div class="cap">dots</div></div>
      <button id="sound" class="rbtn" aria-label="Sound on or off">🔊</button>
    </div>
    <div id="xpwrap"><div id="lv">Lv 1</div><div id="xpbar"><div id="xpfill"></div><div id="xptext">0 / 100</div></div></div>
  </div>
  <div id="hint">👆 drag to steer 🐍</div>
</div>
<div id="toast"></div>

<div id="home" class="overlay"><div class="card pcard">
  <div class="bigTitle">Dot Muncher 🐍</div>
  <p class="tag">Eat the dots &amp; grow!</p>
  <div class="chips"><div class="chip gold" id="homeLv">Level 1</div><div class="chip" id="homeStars">⭐ 0</div></div>
  <button class="bigBtn" id="playBtn">▶ Play</button>
  <button class="lnkBtn" id="homeSkins">🎩 Customize</button>
</div></div>

<div id="reward" class="overlay"><div class="card pcard">
  <div class="tag" style="margin-bottom:4px">You reached</div>
  <div id="rwTitle">Level 2!</div>
  <div id="rwBody"></div>
  <button class="bigBtn" id="rwContinue">Keep playing!</button>
</div></div>

<div id="skins" class="overlay"><div class="card">
  <div class="bigTitle" style="font-size:26px">Customize 🎩</div>
  <p class="tag">Play to unlock more!</p>
  <div class="secLabel">Colors</div><div id="skinGrid" class="cgrid"></div>
  <div class="secLabel">Hats</div><div id="hatGrid" class="cgrid"></div>
  <button class="bigBtn" id="closeSkins" style="margin-top:8px">Done</button>
</div></div>

<script>
(function(){
  // ---------------- config ----------------
  var SPEED=6.0, SPEED_E=5.0, TURN=6.0;
  var R_HEAD=0.95, R_BODY=0.68, R_TAIL=0.16, STEP=0.30, CAP=82, CAPe=30;
  var L0=6.0, GROW=0.85, ELEN_MIN=8, ELEN_MAX=15, ENEMIES=4;
  var PELLETS=50, P_R=0.55, EAT=1.15, RING_IN=16, RING_OUT=42, CULL=50, SHIELD_CHANCE=0.17;
  var P_MAXH=100, P_MAXS=100, HREGEN=8, SREGEN=18, REGEN_DELAY=0.8, HEALTH_FLOOR=14;
  var AI_MAXH=45, AI_MAXS=30, BITE_R=2.6, BITE_DPS=48;
  var PTS_DOT=10, PTS_SHIELD=5, PTS_DEFEAT=30;
  var FOOD_COLORS=[[1,.34,.42],[1,.64,.16],[1,.85,.24],[.38,.76,1],[.72,.46,1],[1,.46,.78],[.46,.88,.46]];
  var SHIELD_COL=[.42,.85,1.0];
  var ENEMY_COLORS=[[.34,.82,.42],[1,.58,.22],[.72,.44,1],[1,.46,.76]];
  var SKY_TOP=[0.55,0.80,1.0], SKY_BOT=[0.88,0.98,0.92], FOG=[0.72,0.87,1.0];

  var SKINS=[
    {id:'blueberry',name:'Blueberry',body:[.20,.46,1.0],need:null},
    {id:'grape',    name:'Grape',    body:[.62,.42,1.0],need:{t:'level',v:2}},
    {id:'apple',    name:'Apple',    body:[.40,.82,.42],need:{t:'level',v:3}},
    {id:'tangerine',name:'Tangerine',body:[1.0,.55,.2], need:{t:'level',v:4}},
    {id:'bubblegum',name:'Bubblegum',body:[1.0,.5,.78], need:{t:'level',v:5}},
    {id:'sunny',    name:'Sunny',    body:[1.0,.83,.28],need:{t:'level',v:6}},
    {id:'rainbow',  name:'Rainbow',  body:'rainbow',    need:{t:'level',v:7}}
  ];
  var HATS=[
    {id:'none',   name:'No Hat',   emoji:'🚫', need:null},
    {id:'party',  name:'Party',    emoji:'🎉', need:{t:'dots',v:10}},
    {id:'top',    name:'Top Hat',  emoji:'🎩', need:{t:'dots',v:30}},
    {id:'cowboy', name:'Cowboy',   emoji:'🤠', need:{t:'dots',v:60}},
    {id:'crown',  name:'Crown',    emoji:'👑', need:{t:'dots',v:100}},
    {id:'wizard', name:'Wizard',   emoji:'🧙', need:{t:'dots',v:160}}
  ];

  var num=document.getElementById('num'), hintEl=document.getElementById('hint');
  var toastEl=document.getElementById('toast'), lvEl=document.getElementById('lv'), xpfill=document.getElementById('xpfill'), xptext=document.getElementById('xptext');
  var homeEl=document.getElementById('home'), rewardEl=document.getElementById('reward'), skinsEl=document.getElementById('skins');
  var canvas=document.getElementById('gl');
  var gl=canvas.getContext('webgl',{antialias:true,alpha:false});
  if(!gl){ document.body.innerHTML='<p style="padding:20px;font:20px sans-serif">Sorry, this device can’t show the 3D game.</p>'; return; }

  // ---------------- progress (saved) ----------------
  var prog={level:1,points:0,totalDots:0,defeat:0,stars:0,unlocked:['blueberry'],skin:'blueberry',hats:['none'],hat:'none'};
  function load(){ try{ var s=localStorage.getItem('dotmuncher2'); if(s){ var o=JSON.parse(s);
    prog.level=o.level||1; prog.points=o.points||0; prog.totalDots=o.totalDots||0; prog.defeat=o.defeat||0; prog.stars=o.stars||0;
    prog.unlocked=(o.unlocked&&o.unlocked.length)?o.unlocked:['blueberry']; prog.skin=o.skin||'blueberry';
    prog.hats=(o.hats&&o.hats.length)?o.hats:['none']; prog.hat=o.hat||'none'; } }catch(e){} }
  function save(){ try{ localStorage.setItem('dotmuncher2',JSON.stringify(prog)); }catch(e){} }
  function need(l){ return l*100; }
  function metNeed(nd){ if(!nd)return true; if(nd.t==='level')return prog.level>=nd.v; if(nd.t==='dots')return prog.totalDots>=nd.v; return false; }
  function ensureUnlocks(){
    for(var i=0;i<SKINS.length;i++){ var sk=SKINS[i]; if(metNeed(sk.need)&&prog.unlocked.indexOf(sk.id)<0) prog.unlocked.push(sk.id); }
    for(var j=0;j<HATS.length;j++){ var h=HATS[j]; if(metNeed(h.need)&&prog.hats.indexOf(h.id)<0) prog.hats.push(h.id); }
  }
  load(); ensureUnlocks();

  function sh(t,s){ var o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(o),s); return o; }
  function prg(v,f){ var p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,v)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));
    gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p)); return p; }

  // cel-shaded + ink-outline (fresnel) lit program
  var litP=prg(
   'attribute vec3 aPos; attribute vec3 aNor; uniform mat4 uProj,uView,uModel; varying vec3 vN,vW;'+
   'void main(){ vec4 w=uModel*vec4(aPos,1.0); vW=w.xyz; vN=mat3(uModel)*aNor; gl_Position=uProj*uView*w; }',
   'precision highp float; varying vec3 vN,vW; uniform vec3 uColor,uCam,uFog; uniform float uShine,uSpec,uAlpha,uOutline;'+
   'uniform int uGround; uniform float uFogN,uFogF;'+
   'void main(){'+
   ' vec3 N=normalize(vN); vec3 L=normalize(vec3(-0.4,1.0,0.55)); vec3 V=normalize(uCam-vW); vec3 H=normalize(L+V);'+
   ' float key=max(dot(N,L),0.0);'+
   ' float lev = key>0.60?1.0 : (key>0.28?0.80 : 0.60);'+   // hard toon bands
   ' vec3 base=uColor;'+
   ' if(uGround==1){ float c=mod(floor(vW.x*0.5+0.001)+floor(vW.z*0.5+0.001),2.0); base*=(c<1.0?1.0:0.86); }'+
   ' vec3 col=base*lev;'+
   ' float s=pow(max(dot(N,H),0.0),uShine); col += smoothstep(0.6,0.92,s)*uSpec;'+   // hard cartoon glare
   ' float rim=1.0-max(dot(N,V),0.0); float o=smoothstep(0.66,0.82,rim)*uOutline;'+   // ink edge
   ' col=mix(col, vec3(0.05,0.05,0.09), o);'+
   ' float fd=length(uCam-vW); col=mix(col,uFog,smoothstep(uFogN,uFogF,fd));'+
   ' gl_FragColor=vec4(col,uAlpha); }');
  var Lu={}; ['uProj','uView','uModel','uColor','uCam','uShine','uSpec','uGround','uFog','uFogN','uFogF','uAlpha','uOutline'].forEach(function(k){Lu[k]=gl.getUniformLocation(litP,k);});
  var LaPos=gl.getAttribLocation(litP,'aPos'), LaNor=gl.getAttribLocation(litP,'aNor');

  var spP=prg(
   'attribute vec2 aQ; uniform mat4 uProj,uView; uniform vec3 uCenter; uniform vec2 uSize; uniform float uOffR; uniform int uBill; varying vec2 vUV;'+
   'void main(){ vUV=aQ; vec3 r=vec3(uView[0][0],uView[1][0],uView[2][0]); vec3 u=vec3(uView[0][1],uView[1][1],uView[2][1]); vec3 wp;'+
   ' if(uBill==1) wp=uCenter + r*(uOffR + aQ.x*uSize.x*0.5) + u*(aQ.y*uSize.y*0.5);'+
   ' else wp=uCenter + vec3(aQ.x,0.0,aQ.y)*uSize.x;'+
   ' gl_Position=uProj*uView*vec4(wp,1.0); }',
   'precision highp float; varying vec2 vUV; uniform vec4 uColor; uniform float uSoft; uniform int uShape;'+
   'void main(){ float a; if(uShape==1){ a=1.0; }'+
   ' else if(uShape==2){ float d=length(vUV); a=smoothstep(1.0,0.72,d)*smoothstep(0.45,0.72,d); }'+
   ' else { float d=length(vUV); a=smoothstep(1.0,uSoft,d); }'+
   ' gl_FragColor=vec4(uColor.rgb, uColor.a*a); }');
  var Su={}; ['uProj','uView','uCenter','uSize','uOffR','uBill','uColor','uSoft','uShape'].forEach(function(k){Su[k]=gl.getUniformLocation(spP,k);});
  var SaQ=gl.getAttribLocation(spP,'aQ');

  var bgP=prg(
   'attribute vec2 aQ; varying vec2 vUV; void main(){ vUV=aQ; gl_Position=vec4(aQ,0.999,1.0); }',
   'precision highp float; varying vec2 vUV; uniform vec3 uTop,uBot; void main(){ float t=vUV.y*0.5+0.5;'+
   ' t=floor(t*5.0)/5.0; gl_FragColor=vec4(mix(uBot,uTop,t),1.0); }');   // banded cartoon sky
  var Bu={top:gl.getUniformLocation(bgP,'uTop'),bot:gl.getUniformLocation(bgP,'uBot')}, BaQ=gl.getAttribLocation(bgP,'aQ');

  // ---------------- geometry ----------------
  function fbuf(d){ var b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(d),gl.STATIC_DRAW); return b; }
  function ebuf(d){ var b=gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(d),gl.STATIC_DRAW); return b; }
  function sphere(la,lo){ var p=[],idx=[];
    for(var i=0;i<=la;i++){ var th=i/la*Math.PI, st=Math.sin(th), ct=Math.cos(th);
      for(var j=0;j<=lo;j++){ var ph=j/lo*6.283, sp=Math.sin(ph), cp=Math.cos(ph); p.push(cp*st,ct,sp*st); } }
    for(var i=0;i<la;i++)for(var j=0;j<lo;j++){ var a=i*(lo+1)+j,b=a+lo+1; idx.push(a,b,a+1,b,b+1,a+1); }
    return {pos:fbuf(p),idx:ebuf(idx),n:idx.length,inter:false}; }
  var SPH=sphere(16,24);
  function cylinder(seg){ var p=[],idx=[],base=0;
    for(var j=0;j<=seg;j++){ var a=j/seg*6.283, x=Math.cos(a), z=Math.sin(a);
      p.push(x,0,z,x,0,z); p.push(x,1,z,x,0,z); }
    for(var j=0;j<seg;j++){ var o=j*2; idx.push(o,o+1,o+2, o+1,o+3,o+2); }
    var tc=p.length/6; p.push(0,1,0,0,1,0); var tr=p.length/6;
    for(var j=0;j<=seg;j++){ var a=j/seg*6.283; p.push(Math.cos(a),1,Math.sin(a),0,1,0); }
    for(var j=0;j<seg;j++) idx.push(tc,tr+j,tr+j+1);
    var bc=p.length/6; p.push(0,0,0,0,-1,0); var br=p.length/6;
    for(var j=0;j<=seg;j++){ var a=j/seg*6.283; p.push(Math.cos(a),0,Math.sin(a),0,-1,0); }
    for(var j=0;j<seg;j++) idx.push(bc,br+j+1,br+j);
    return {buf:fbuf(p),idx:ebuf(idx),n:idx.length,inter:true}; }
  var CYL=cylinder(18);
  function cone(seg){ var p=[],idx=[],c=0;
    for(var j=0;j<seg;j++){ var a0=j/seg*6.283, a1=(j+1)/seg*6.283;
      var x0=Math.cos(a0),z0=Math.sin(a0),x1=Math.cos(a1),z1=Math.sin(a1);
      var nx=(x0+x1)*0.5, nz=(z0+z1)*0.5, nl=Math.hypot(nx,0.55,nz); nx/=nl; var ny=0.55/nl; nz/=nl;
      p.push(x0,0,z0,nx,ny,nz); p.push(x1,0,z1,nx,ny,nz); p.push(0,1,0,nx,ny,nz); idx.push(c,c+1,c+2); c+=3; }
    var bc=c; p.push(0,0,0,0,-1,0); c++; var br=c;
    for(var j=0;j<=seg;j++){ var a=j/seg*6.283; p.push(Math.cos(a),0,Math.sin(a),0,-1,0); }

      for(var k=K-1;k>=0;k--){ var t=k/(K-1), d=t*s.curLen, p=(k===0)?{x:s.hx,z:s.hz}:pointAt(s.path,d);
        var r=segR(t,k); drawLit(SPH, mdl(p.x,r,p.z,r), bodyColor(s,d,t), 40, 0.5, 0, 1, k===0?1:0);
        if(k===0){ drawEyes(s,p.x,r,p.z); drawHat(s.hat,p.x,p.z,R_HEAD); } } }

    for(var i=0;i<pellets.length;i++){ var p=pellets[i]; if(Math.hypot(p.x-player.hx,p.z-player.hz)>CULL)continue;
      var by=P_R+0.15+0.12*Math.sin(tsec*2.4+p.ph); ball(p.x,by,p.z, p.type==='shield'?P_R*1.15:P_R, p.c, 1); }

    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
    for(var n=0;n<snakes.length;n++){ var s=snakes[n]; if(!visible(s)||s.shield<=0)continue;
      var frac=s.shield/s.maxShield, pr=1+0.03*Math.sin(tsec*4+n);
      drawLit(SPH, mdl(s.hx,segR(0,0),s.hz, R_HEAD*1.9*pr), SHIELD_COL, 40,0.4,0, 0.15+0.14*frac, 0); }
    gl.depthMask(true);

    gl.blendFunc(gl.SRC_ALPHA,gl.ONE); gl.depthMask(false);
    for(var i=0;i<pellets.length;i++){ var p=pellets[i]; if(Math.hypot(p.x-player.hx,p.z-player.hz)>CULL)continue;
      var by=P_R+0.15+0.12*Math.sin(tsec*2.4+p.ph), g=0.42+0.18*Math.sin(tsec*2.4+p.ph);
      sprite(p.x,by,p.z, P_R*2.2,P_R*2.2, 0, p.c, 0.22*g, 1,0,0.0);
      if(p.type==='shield') sprite(p.x,by,p.z, P_R*3.2,P_R*3.2, 0, SHIELD_COL, 0.5, 1,2,0.0); }
    for(var i=0;i<sparks.length;i++){ var s=sparks[i], a=Math.max(s.life/s.max,0);
      sprite(s.x,s.y,s.z, 0.16+0.16*a,0.16+0.16*a, 0, s.c, a, 1,0,0.0); }
    gl.depthMask(true);

    gl.disable(gl.DEPTH_TEST); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    for(var n=0;n<snakes.length;n++){ var s=snakes[n]; if(!visible(s))continue; drawBars(s); }
    gl.enable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
  }

  // ---------------- input ----------------
  var dragging=false,lpx=0,lpy=0,hid=false;
  function steer(dx,dy){ if(mode!=='play'||Math.hypot(dx,dy)<5)return; player.target=Math.atan2(dy,dx); if(!hid){hid=true;hintEl.style.opacity='0';} }
  canvas.addEventListener('pointerdown',function(e){ unlock(); if(mode!=='play')return; dragging=true; lpx=e.clientX; lpy=e.clientY; try{canvas.setPointerCapture(e.pointerId);}catch(_){}});
  canvas.addEventListener('pointermove',function(e){ if(!dragging)return; steer(e.clientX-lpx,e.clientY-lpy); lpx=e.clientX; lpy=e.clientY; });
  canvas.addEventListener('pointerup',function(){dragging=false;}); canvas.addEventListener('pointercancel',function(){dragging=false;});
  window.addEventListener('keydown',function(e){ var m={ArrowUp:-Math.PI/2,ArrowDown:Math.PI/2,ArrowLeft:Math.PI,ArrowRight:0};
    if(m[e.key]!==undefined){e.preventDefault(); if(mode==='play'){ player.target=m[e.key]; if(!hid){hid=true;hintEl.style.opacity='0';} }} });

  // ---------------- screens ----------------
  function goHome(){ mode='home'; updateHome(); homeEl.classList.add('show'); }
  function startGame(){ unlock(); reset(); hid=false; hintEl.style.opacity=''; updateHUD(); homeEl.classList.remove('show'); rewardEl.classList.remove('show'); mode='play'; }
  document.getElementById('playBtn').addEventListener('click',startGame);
  document.getElementById('homeBtn').addEventListener('click',goHome);
  document.getElementById('rwContinue').addEventListener('click',function(){ rewardEl.classList.remove('show'); mode='play'; tryLevelUp(); });

  var skinGrid=document.getElementById('skinGrid'), hatGrid=document.getElementById('hatGrid');
  function buildCustomize(){
    skinGrid.innerHTML='';
    SKINS.forEach(function(sk){ var un=prog.unlocked.indexOf(sk.id)>=0, seld=prog.skin===sk.id;
      var t=document.createElement('button'); t.className='tile'+(un?'':' locked')+(seld?' sel':'');
      var sw=sk.body==='rainbow'?'background:linear-gradient(90deg,#ff5d73,#ffb03a,#ffe14d,#7bd0ff,#c58bff);'
             :'background:rgb('+sk.body.map(function(v){return Math.round(v*255);}).join(',')+');';
      t.innerHTML='<div class="swatch" style="'+sw+'"></div><div class="nm">'+sk.name+'</div><div class="req">'+(un?(seld?'On ✓':'Wear'):progS(sk))+'</div>';
      t.addEventListener('click',function(){ if(prog.unlocked.indexOf(sk.id)<0)return; prog.skin=sk.id; if(player)player.color=playerColor(); save(); buildCustomize(); pick(); });
      skinGrid.appendChild(t); });
    hatGrid.innerHTML='';
    HATS.forEach(function(h){ var un=prog.hats.indexOf(h.id)>=0, seld=prog.hat===h.id;
      var t=document.createElement('button'); t.className='tile'+(un?'':' locked')+(seld?' sel':'');
      t.innerHTML='<div class="swatch emoji">'+h.emoji+'</div><div class="nm">'+h.name+'</div><div class="req">'+(un?(seld?'On ✓':'Wear'):progH(h))+'</div>';
      t.addEventListener('click',function(){ if(prog.hats.indexOf(h.id)<0)return; prog.hat=h.id; if(player)player.hat=h.id; save(); buildCustomize(); pick(); });
      hatGrid.appendChild(t); });
  }
  document.getElementById('homeSkins').addEventListener('click',function(){ unlock(); buildCustomize(); skinsEl.classList.add('show'); });
  document.getElementById('closeSkins').addEventListener('click',function(){ skinsEl.classList.remove('show'); });

  // ---------------- sound ----------------
  var actx=null,muted=false;
  function unlock(){ if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(actx&&actx.state==='suspended')actx.resume(); }
  function tone(freqs,dur,vol,type,gap){ if(muted||!actx)return; freqs.forEach(function(f,i){ var o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine'; o.frequency.value=f; var s=actx.currentTime+i*(gap||0.06); g.gain.setValueAtTime(0,s);
    g.gain.linearRampToValueAtTime(vol||0.09,s+0.03); g.gain.exponentialRampToValueAtTime(0.0001,s+(dur||0.32));
    o.connect(g); g.connect(actx.destination); o.start(s); o.stop(s+(dur||0.34)); }); }
  function chime(){ tone([523.25,659.25,783.99],0.32,0.08); }
  function pick(){ tone([659.25,880],0.2,0.08); }
  function shieldSound(){ tone([440,660,990],0.28,0.07,'triangle'); }
  function defeatSound(){ tone([392,523,659,784],0.3,0.08,'sine',0.07); }
  function levelSound(){ tone([523,659,784,1047,1319],0.45,0.09,'sine',0.09); }
  function unlockSound(){ tone([784,988,1319],0.4,0.08,'triangle',0.08); }
  document.getElementById('sound').addEventListener('click',function(){ muted=!muted; unlock(); this.textContent=muted?'🔈':'🔊'; });

  // ---------------- boot ----------------
  updateHUD(); reset(); updateHome(); homeEl.classList.add('show'); requestAnimationFrame(frame);
})();
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
